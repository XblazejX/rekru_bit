version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: bit2meet_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bit2meet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bit2meet_password}
      POSTGRES_DB: ${POSTGRES_DB:-bit2meet_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bit2meet_user} -d ${POSTGRES_DB:-bit2meet_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bit2meet_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-bit2meet_user}:${POSTGRES_PASSWORD:-bit2meet_password}@db:5432/${POSTGRES_DB:-bit2meet_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bit2meet_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
